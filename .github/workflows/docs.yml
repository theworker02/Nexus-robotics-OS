name: Documentation and release checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo doc --workspace --no-deps

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release-candidate metadata
        shell: bash
        run: |
          grep -q 'version = "4.2.0-rc.1"' Cargo.toml
          grep -q '4.2.0-rc.1' CITATION.cff
          grep -q 'theworker02' .github/FUNDING.yml
          test -s docs/releases/v4.2.0.md
          test -s docs/releases/4.2-validation.md
